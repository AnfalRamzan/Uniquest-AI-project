spring.application.name=uniquest
server.port=8080

# ================= MySQL (no password) =================
spring.datasource.url=jdbc:mysql://localhost:3306/uniquest?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

